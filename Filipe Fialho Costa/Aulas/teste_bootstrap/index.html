<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>

  <div class="container py-5">
    <div class="p-4 bg-primary text-white text-center rounded">
      Bootstrap funcionando!
    </div>
  </div>
  <div class="container py-4">
  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="bg-primary rounded" style="height: 120px;"></div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
      <div class="bg-success rounded" style="height: 120px;"></div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
      <div class="bg-warning rounded" style="height: 120px;"></div>
    </div>
    <div class="container py-4">
  <div class="row g-2">
    <div class="col-4">
      <div class="bg-primary rounded" style="height: 100px;"></div>
    </div>
    <div class="col-4">
      <div class="bg-success rounded" style="height: 100px;"></div>
    </div>
    <div class="col-4">
      <div class="bg-warning rounded" style="height: 100px;"></div>
    </div>
  </div>
</div>
  </div>
  <div class="container py-4">
  <div class="d-flex justify-content-start mb-2 p-2 bg-light">
    <div class="bg-primary rounded" style="width: 80px; height: 50px;"></div>
  </div>
  <div class="d-flex justify-content-center mb-2 p-2 bg-light">
    <div class="bg-success rounded" style="width: 80px; height: 50px;"></div>
  </div>

  <div class="d-flex justify-content-end p-2 bg-light">
    <div class="bg-warning rounded" style="width: 80px; height: 50px;"></div>
  </div>
  <div class="container py-4">
  <div class="d-flex justify-content-center">
    <div class="bg-primary rounded" style="width: 120px; height: 120px;"></div>
  </div>

  <div class="container py-4">
  <div class="d-flex justify-content-between align-items-center p-3 bg-light">
    <div class="bg-primary rounded" style="width: 70px; height: 70px;"></div>
    <div class="bg-success rounded" style="width: 70px; height: 70px;"></div>
    <div class="bg-warning rounded" style="width: 70px; height: 70px;"></div>
    <div class="container py-4">
  <div class="mb-3 bg-primary rounded" style="height: 70px;"></div>
  <div class="p-3 mb-3 bg-success rounded" style="height: 70px;"></div>
  <div class="p-4 bg-warning rounded" style="height: 70px;"></div>
</div>
</div>

</div>
</div>
</div>
</div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
