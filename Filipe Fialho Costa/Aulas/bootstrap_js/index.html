<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="border-bottom border-secondary">
      <div class="container">
        <nav class="d-flex justify-content-between align-items-center py-3">
          <a href="#" class="text-decoration-none fw-bold fs-4">Dev Cursos</a>
          <div class="d-flex gap-3">
            <a href="#cursos" class="text-decoration-none">Cursos</a>
            <a href="#sobre" class="text-decoration-none">Sobre</a>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero py-5">
        <div class="container">
          <div class="row align-items-center g-4">
            <div class="col-12 col-md-6">
              <span class="badge text-bg-primary mb-3">
                Desenvolvimento web</span
              >
              <h1 class="display-5 fw-bold">Aprenda a construir sistemas.</h1>
              <p class="lead text-secondary">
                Cursos para desenvolver suas habilidades.
              </p>
              <a href="#cursos" class="btn btn-info">Ver cursos</a>
            </div>
            <div class="col-12 col-md-6">
              <div
                class="hero-card bg-dark text-white rounded-4 d-flex justify-content-center align-items-center"
              >
                <div class="text-center">
                  <div class="display-1">©</div>
                  <p class="mb0">Direitos</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section id="cursos" class="py-5">
        <div class="container">
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
          >
            <div>
              <h2 class="fw-bold mb-1">Nossos Cursos</h2>
              <p class="text-secondary mb-0">Escolha uma tecnologia</p>
            </div>

            <div class="d-flex gap-2">
              <button id="btnTodos" class="btn btn-primary">Todos</button>
              <button id="btnAtivos" class="btn btn-outline-primary">
                Ativos
              </button>
            </div>
          </div>
        </div>

        <div id="listaCursos" class="row g-4"></div>
      </section>
    </main>

    <footer class="border-top py-4">
      <div class="container">
        <div
          class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2"
        >
          <span class="text-secondary">2026</span>
          <span class="text-secondary"> Desenvolvido em sala de aula </span>
        </div>
      </div>
    </footer>

    <!--Script no final da page para nao da problema de carregamento do DOM-->
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
